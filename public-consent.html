<section id="ats-consent" class="ats-consent" aria-labelledby="ats-consent-title" hidden>
  <h2 id="ats-consent-title" tabindex="-1">Privacy settings</h2>
  <p id="ats-consent-description">Analytics is optional. Calls and estimate requests work with either choice.</p>
  <p id="ats-consent-status" role="status" aria-live="polite"></p>
  <div class="ats-consent__actions">
    <button id="ats-consent-allow" type="button">Allow analytics</button>
    <button id="ats-consent-reject" type="button">Reject analytics</button>
  </div>
  <p class="ats-consent__detail">Your choice stays in this browser for up to 180 days. You can change it here at any time. <a href="/privacy/#website-analytics">Read our privacy policy</a>.</p>
  <button id="ats-consent-close" type="button" class="ats-consent__close">Close settings</button>
</section>
<script defer src="/ats-consent.js?v=consent1"></script>
