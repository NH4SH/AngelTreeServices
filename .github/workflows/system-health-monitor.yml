name: Production system health

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-system-health
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_URL: https://admin.angeltreeservices.org
      PUBLIC_URL: https://angeltreeservices.org
      CUSTOMER_PORTAL_URL: ${{ vars.CUSTOMER_PORTAL_BASE_URL }}
      MONITOR_SECRET: ${{ secrets.SYSTEM_HEALTH_MONITOR_SECRET }}
    steps:
      - name: Check out monitor classifier
        uses: actions/checkout@v4

      - name: Check critical production paths
        id: checks
        shell: bash
        run: |
          set +e
          healthy="true"
          category="healthy"
          http_status="none"
          issue_title="[System Health] Production monitoring incident"
          failures=""
          observations=""

          record_failure() {
            local failure_category="$1"
            local failure_status="$2"
            local failure_summary="$3"
            local failure_title="$4"
            if [ "${healthy}" = "true" ]; then
              category="${failure_category}"
              http_status="${failure_status}"
              issue_title="${failure_title}"
            fi
            healthy="false"
            failures="${failures}${failure_summary}; "
          }

          check_url() {
            local label="$1"
            local url="$2"
            local failure_category="$3"
            local failure_title="$4"
            local failure_summary="$5"
            if ! curl --fail --silent --show-error --location \
              --connect-timeout 8 --max-time 20 --retry 1 --retry-delay 10 \
              "$url" >/dev/null; then
              observations="${observations}${label}: failed; "
              record_failure "${failure_category}" "none" "${failure_summary}" "${failure_title}"
            else
              observations="${observations}${label}: passed; "
            fi
          }

          check_url "Public website" "${PUBLIC_URL}/" \
            "customer_facing_endpoint" "[System Health] Public website unavailable" "Public website unavailable"
          check_url "Essential public asset" "${PUBLIC_URL}/assets/favicon-32.png" \
            "customer_facing_endpoint" "[System Health] Essential public asset unavailable" "Essential public asset unavailable"
          check_url "CRM liveness" "${ADMIN_URL}/api/health/live" \
            "crm_liveness" "[System Health] CRM liveness unavailable" "CRM liveness unavailable"

          if [ -n "${CUSTOMER_PORTAL_URL}" ]; then
            check_url "Customer portal" "${CUSTOMER_PORTAL_URL}/portal/quote/system-health-invalid-token" \
              "customer_portal" "[System Health] Customer portal unavailable" "Customer portal unavailable"
          else
            observations="${observations}Customer portal: not configured for independent check; "
          fi

          if [ -z "${MONITOR_SECRET}" ]; then
            observations="${observations}Detailed system health: not run (monitor secret missing); "
            record_failure \
              "authentication_configuration" \
              "none" \
              "SYSTEM_HEALTH_MONITOR_SECRET is not configured in GitHub Actions" \
              "[System Health] Monitor authentication/configuration problem"
          else
            detailed_response="$(mktemp)"
            detailed_status="$(curl --silent --show-error \
              --output "${detailed_response}" --write-out "%{http_code}" \
              --connect-timeout 8 --max-time 90 --retry 1 --retry-delay 15 --retry-all-errors \
              -X POST -H "Authorization: Bearer ${MONITOR_SECRET}" \
              "${ADMIN_URL}/api/internal/system-health/run")"
            detailed_exit=$?
            IFS=$'\t' read -r detailed_healthy detailed_category detailed_http detailed_summary detailed_title \
              < <(node .github/scripts/system-health-monitor.mjs "${detailed_exit}" "${detailed_status}" "${detailed_response}")
            if [ "${detailed_healthy}" = "true" ]; then
              observations="${observations}Detailed system health: passed (HTTP ${detailed_http}); "
            else
              observations="${observations}Detailed system health: failed (${detailed_category}, HTTP ${detailed_http}); "
              record_failure "${detailed_category}" "${detailed_http}" "${detailed_summary}" "${detailed_title}"
            fi
            rm -f "${detailed_response}"
          fi

          if [ "${healthy}" = "true" ]; then
            summary="All independent and detailed checks passed."
          else
            summary="${failures}"
          fi

          echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"
          echo "category=${category}" >> "$GITHUB_OUTPUT"
          echo "http_status=${http_status}" >> "$GITHUB_OUTPUT"
          echo "issue_title=${issue_title}" >> "$GITHUB_OUTPUT"
          echo "observations=${observations}" >> "$GITHUB_OUTPUT"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Open or recover monitoring incident
        uses: actions/github-script@v7
        env:
          CATEGORY: ${{ steps.checks.outputs.category }}
          HEALTHY: ${{ steps.checks.outputs.healthy }}
          HTTP_STATUS: ${{ steps.checks.outputs.http_status }}
          ISSUE_TITLE: ${{ steps.checks.outputs.issue_title }}
          OBSERVATIONS: ${{ steps.checks.outputs.observations }}
          SUMMARY: ${{ steps.checks.outputs.summary }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const monitor = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/system-health-monitor.mjs`).href);
            const title = process.env.ISSUE_TITLE || "[System Health] Production monitoring incident";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const active = issues.find((issue) => issue.title.startsWith("[System Health]"));
            const healthy = process.env.HEALTHY === "true";
            const timestamp = new Date().toISOString();
            const action = monitor.decideIssueAction({ activeIssue: active, healthy, title });
            const incidentBody = monitor.buildIncidentBody({
              category: process.env.CATEGORY,
              detectedAt: timestamp,
              httpStatus: process.env.HTTP_STATUS,
              observations: process.env.OBSERVATIONS,
              summary: process.env.SUMMARY,
            });

            if (action === "create") {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: incidentBody,
              });
            } else if (action === "update_category") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: active.number,
                body: `A later monitor run observed a different failure category.\n\n${incidentBody}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: active.number,
                title,
              });
            } else if (action === "recover") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: active.number,
                body: monitor.buildRecoveryComment(timestamp),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: active.number,
                state: "closed",
                state_reason: "completed",
              });
            }
