# Private container/host only. Never publish clamd outside the isolated scanner.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
ConcurrentDatabaseReload no
SelfCheck 600
StreamMaxLength 26M
MaxFileSize 26M
MaxScanSize 100M
MaxScanTime 8000
MaxRecursion 16
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
EnableVersionCommand yes
