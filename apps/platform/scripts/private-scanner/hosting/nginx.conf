pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/null;
events { worker_connections 128; }
http {
  # Operational output contains status and latency only, never URIs, headers,
  # IPs, filenames or document bytes. No persistent request/response body cache.
  log_format scanner_status '$status $request_time';
  access_log /dev/stdout scanner_status;
  server_tokens off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  client_max_body_size 25m;
  client_body_buffer_size 16k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 10s;
  send_timeout 15s;
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_tickets off;
    add_header Cache-Control 'no-store' always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location = /scan {
      # Resolve again after a bridge replacement; never retain a retired IP.
      set $scanner_upstream http://bridge:3311;
      proxy_pass $scanner_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Authorization $http_authorization;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_max_temp_file_size 0;
      proxy_connect_timeout 2s;
      proxy_send_timeout 15s;
      proxy_read_timeout 15s;
      proxy_next_upstream off;
    }
    location / { return 404; }
  }
}
