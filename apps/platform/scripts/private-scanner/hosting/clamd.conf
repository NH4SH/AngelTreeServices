Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LeaveTemporaryFiles no
PidFile /tmp/clamd.pid
LogFile /dev/null
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 2
MaxQueue 4
ConcurrentDatabaseReload no
SelfCheck 600
StreamMaxLength 26M
# Keep the per-member ceiling at the aggregate budget. A lower member ceiling
# lets ClamAV's ZIP extractor truncate a member before aggregate-limit alerting.
# The HTTP/application upload ceiling remains 25 MiB; expanded work is 100 MiB.
MaxFileSize 100M
MaxScanSize 100M
MaxScanTime 8000
MaxRecursion 16
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
HeuristicAlerts yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
EnableVersionCommand yes
