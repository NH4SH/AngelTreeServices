name: ATS isolated PostgreSQL preload

on:
  push:
    branches: [codex/ats-native-preload-20261111]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ats-native-preload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-image-probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the public migration parser
        run: python3 scripts/ci/ats-native-preload/test_probe.py
      - name: Prove the pinned native libraries in isolation
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_TEMP /usr/bin/python3 scripts/ci/ats-native-preload/probe.py
      - name: Preserve only sanitized proof metadata
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ats-native-preload-proof
          path: ci-results/ats-native-preload.json
          if-no-files-found: warn
          retention-days: 30
