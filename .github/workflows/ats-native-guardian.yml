name: ATS native guardian custody rehearsal
on:
  push:
    branches: [codex/ats-native-guardian-20261111]
permissions:
  contents: read
concurrency:
  group: ats-native-guardian-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned-custody:
    if: github.repository == 'NH4SH/AngelTreeServices'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run owned native filesystem and lock cases
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,GITHUB_REF,GITHUB_SHA /usr/bin/python3 scripts/ats-native-guardian/probe.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: ats-native-guardian-custody-proof
          path: ci-results/guardian-proof.json
          if-no-files-found: warn
          retention-days: 7
